<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Mohamed Taha | Cybersecurity Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#070b10;
  --text:#e8eef7;
  --muted:#91a3b8;
  --line:#243244;
  --accent:#4da3ff;
  --green:#34d399;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  line-height:1.7;
}

/* BACKGROUND */

body::before{
  content:"";
  position:fixed;
  inset:0;

  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

  background-size:60px 60px;

  z-index:-3;
}

body::after{
  content:"";
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle at top right, rgba(77,163,255,0.12), transparent 25%),
    radial-gradient(circle at bottom left, rgba(52,211,153,0.05), transparent 25%);

  z-index:-2;
}

/* CURSOR GLOW */

.cursor-glow{
  position:fixed;
  width:600px;
  height:600px;
  border-radius:50%;
  pointer-events:none;

  background:
    radial-gradient(circle,
    rgba(77,163,255,0.12),
    transparent 70%);

  z-index:-1;

  transform:translate(-50%, -50%);

  transition:
    left .08s linear,
    top .08s linear;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  background:#05080d;

  display:flex;
  justify-content:center;
  align-items:center;

  flex-direction:column;

  z-index:9999;

  overflow:hidden;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease;
}

.floating-panels{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.panel{
  position:absolute;

  width:180px;
  height:110px;

  border-radius:20px;

  background:
    rgba(255,255,255,0.02);

  border:
    1px solid rgba(255,255,255,0.06);

  backdrop-filter:blur(10px);

  animation:
    floatPanel 10s ease-in-out infinite;
}

.panel:nth-child(1){
  top:10%;
  left:8%;
}

.panel:nth-child(2){
  top:18%;
  right:10%;
}

.panel:nth-child(3){
  bottom:15%;
  left:12%;
}

.panel:nth-child(4){
  bottom:10%;
  right:14%;
}

.panel:nth-child(5){
  top:52%;
  left:4%;
}

.panel:nth-child(6){
  top:56%;
  right:5%;
}

@keyframes floatPanel{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-14px);
  }

  100%{
    transform:translateY(0px);
  }

}

.intro-box{
  text-align:center;
  z-index:2;
  position:relative;
}

.intro-box h1{
  font-size:58px;
  letter-spacing:5px;
  margin-bottom:10px;
}

.intro-box h2{
  color:var(--accent);
  font-size:18px;
  font-weight:500;
  margin-bottom:20px;
}

.intro-box p{
  color:var(--muted);
  margin-bottom:30px;
}

.terminal{
  width:520px;
  max-width:90vw;

  background:
    rgba(10,15,24,0.85);

  border:
    1px solid rgba(255,255,255,0.06);

  border-radius:18px;

  padding:24px;

  text-align:left;

  min-height:150px;

  color:#7dd3fc;

  margin:auto auto 30px;

  box-shadow:
    0 0 30px rgba(77,163,255,0.08);
}

button{
  padding:14px 28px;

  border-radius:14px;

  border:
    1px solid rgba(77,163,255,0.3);

  background:
    rgba(77,163,255,0.08);

  color:white;

  cursor:pointer;

  transition:.35s;

  font-size:14px;
}

button:hover{

  transform:
    translateY(-4px)
    scale(1.03);

  background:
    rgba(77,163,255,0.14);

  box-shadow:
    0 20px 40px rgba(77,163,255,0.15);
}

/* UNLOCK SCREEN */

#unlock-screen{

  position:fixed;
  inset:0;

  background:#05080d;

  display:flex;
  justify-content:center;
  align-items:center;

  opacity:0;
  visibility:hidden;

  z-index:9998;

  transition:1s ease;
}

#unlock-screen.active{
  opacity:1;
  visibility:visible;
}

.unlock-core{
  position:relative;

  width:260px;
  height:260px;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.unlock-ring{
  position:absolute;

  width:220px;
  height:220px;

  border-radius:50%;

  border:
    2px solid rgba(77,163,255,0.35);

  animation:
    rotateRing 6s linear infinite;
}

.ring2{
  width:160px;
  height:160px;

  animation-direction:reverse;
}

.unlock-ring::before{
  content:"";

  position:absolute;

  width:14px;
  height:14px;

  border-radius:50%;

  background:var(--accent);

  top:-7px;
  left:50%;

  transform:translateX(-50%);
}

.unlock-text{
  font-size:28px;
  font-weight:600;
  letter-spacing:3px;
  z-index:2;
}

.unlock-sub{
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
  z-index:2;
}

@keyframes rotateRing{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* NAV */

nav{
  position:sticky;
  top:0;

  backdrop-filter:blur(10px);

  background:
    rgba(7,11,16,0.75);

  border-bottom:
    1px solid rgba(255,255,255,0.04);

  z-index:100;
}

.nav-inner{
  width:min(1150px,90%);
  margin:auto;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:18px 0;
}

.logo{
  font-weight:700;
  letter-spacing:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:12px;

  color:var(--muted);
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--green);

  animation:pulse 2s infinite;
}

@keyframes pulse{

  0%{opacity:.4;}
  50%{opacity:1;}
  100%{opacity:.4;}

}

/* CONTAINER */

.container{
  width:min(1150px,90%);
  margin:auto;
}

/* HERO */

.hero{
  min-height:100vh;

  display:flex;
  align-items:center;

  padding:100px 0;
}

.hero-grid{
  width:100%;
}

.single-column{

  max-width:900px;

  margin:auto;

  text-align:center;

  justify-items:center;
}

.single-column p{
  max-width:760px;
  margin:auto;
}

.single-column .buttons{
  justify-content:center;
}

.single-column .ai-line{
  margin:25px auto;
}

.hero h1{
  font-size:72px;
  line-height:1.05;
  margin-bottom:18px;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  color:var(--muted);
  font-size:18px;
}

/* AI LINE */

.ai-line{
  width:180px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--accent),
      transparent
    );

  animation:scan 3s linear infinite;
}

@keyframes scan{

  0%{
    opacity:.4;
    transform:translateX(-20px);
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:.4;
    transform:translateX(20px);
  }

}

/* BUTTONS */

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-top:35px;
}

.buttons a{
  padding:14px 22px;

  border-radius:14px;

  text-decoration:none;

  color:white;

  border:
    1px solid rgba(255,255,255,0.06);

  background:
    rgba(255,255,255,0.02);

  transition:.35s;
}

.buttons a:hover{

  transform:
    translateY(-4px)
    scale(1.03);

  border-color:var(--accent);

  box-shadow:
    0 15px 35px rgba(77,163,255,0.12);
}

.primary{
  background:
    rgba(77,163,255,0.12)!important;

  border-color:
    var(--accent)!important;
}

/* SECTIONS */

section{
  padding:110px 0;
}

.section-label{
  color:var(--accent);
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.section-title{
  font-size:42px;
  margin-bottom:25px;
}

.about{
  max-width:850px;
  color:var(--muted);
  font-size:18px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));

  gap:22px;
}

/* CARDS */

.card{

  background:
    rgba(19,28,40,0.72);

  border:
    1px solid rgba(255,255,255,0.05);

  border-radius:22px;

  padding:24px;

  backdrop-filter:blur(10px);

  transition:.4s;

  position:relative;

  overflow:hidden;

  transform-style:preserve-3d;
}

.card:hover{

  transform:
    perspective(1000px)
    rotateX(6deg)
    rotateY(-6deg)
    translateY(-10px)
    scale(1.02);

  border-color:
    rgba(77,163,255,0.22);

  box-shadow:
    0 30px 60px rgba(0,0,0,0.45),
    0 0 35px rgba(77,163,255,0.08);
}

/* TAGS */

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.tag{
  padding:8px 12px;

  border-radius:12px;

  background:#0f1722;

  border:
    1px solid rgba(255,255,255,0.06);

  color:var(--muted);

  font-size:13px;

  transition:.3s;
}

.tag:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
  color:white;
}

/* TIMELINE */

.timeline{
  border-left:
    2px solid rgba(255,255,255,0.08);

  padding-left:28px;
}

.timeline-item{
  margin-bottom:45px;
}

.timeline-item p{
  color:var(--muted);
}

/* FOOTER */

footer{
  border-top:
    1px solid rgba(255,255,255,0.05);

  padding:50px 0;

  text-align:center;

  color:var(--muted);
}

footer a{
  color:var(--accent);
  text-decoration:none;
}

/* MOBILE */

@media(max-width:900px){

.hero h1{
  font-size:52px;
}

.intro-box h1{
  font-size:40px;
}

}

</style>
</head>

<body>

<div class="cursor-glow"></div>

<!-- INTRO -->

<div id="intro">

<div class="floating-panels">

<div class="panel"></div>
<div class="panel"></div>
<div class="panel"></div>
<div class="panel"></div>
<div class="panel"></div>
<div class="panel"></div>

</div>

<div class="intro-box">

<h1>MOHAMED TAHA</h1>

<h2>CYBERSECURITY PORTFOLIO</h2>

<p>Secure Access Required</p>

<div class="terminal" id="terminal"></div>

<button onclick="startPortfolio()">
Initialize Session
</button>

</div>

</div>

<!-- UNLOCK -->

<div id="unlock-screen">

<div class="unlock-core">

<div class="unlock-ring"></div>
<div class="unlock-ring ring2"></div>

<div class="unlock-text">
ACCESS GRANTED
</div>

<div class="unlock-sub">
Initializing Secure Interface
</div>

</div>

</div>

<!-- YOUR EXISTING PORTFOLIO CONTENT GOES BELOW -->
<!-- KEEP EVERYTHING FROM NAV DOWN -->

<script>

/* TERMINAL */

const lines = [

'> Establishing secure connection...',
'> Verifying credentials...',
'> Initializing security interface...',
'> Loading portfolio modules...',
'> Access granted.'

];

let i = 0;

function typeLines(){

  if(i < lines.length){

    document
      .getElementById('terminal')
      .innerHTML += lines[i] + '<br>';

    i++;

    setTimeout(typeLines,700);

  }

}

/* INTRO FLOW */

function startPortfolio(){

  typeLines();

  setTimeout(()=>{

    document.getElementById('intro').style.opacity='0';

    setTimeout(()=>{

      document.getElementById('intro').style.display='none';

      document
        .getElementById('unlock-screen')
        .classList.add('active');

      setTimeout(()=>{

        document
          .getElementById('unlock-screen')
          .style.opacity='0';

        setTimeout(()=>{

          document
            .getElementById('unlock-screen')
            .style.display='none';

        },1000);

      },2200);

    },1000);

  },4200);

}

/* CURSOR GLOW */

const glow = document.querySelector('.cursor-glow');

document.addEventListener('mousemove', (e)=>{

  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';

});

</script>

</body>
</html>
